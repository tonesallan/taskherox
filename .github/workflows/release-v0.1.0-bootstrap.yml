name: TaskHeroX v0.1.0 Bootstrap Release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.repository == 'tonesallan/taskherox' &&
      github.actor == 'tonesallan' &&
      github.head_ref == 'release/v0.1.0-trigger'
    runs-on: windows-latest

    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@v4
        with:
          ref: 93dc08ec6ffbd532eaa3c576839821d94dc3004d
          fetch-depth: 0

      - name: Verify release commit belongs to main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor '93dc08ec6ffbd532eaa3c576839821d94dc3004d' 'origin/main'
          if ($LASTEXITCODE -ne 0) {
            throw 'Release bloqueado: o commit validado nao pertence a main.'
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TbhBot.slnx

      - name: Test
        run: dotnet test TbhBot.slnx -c Release --no-restore

      - name: Publish TaskHeroX v0.1.0
        shell: pwsh
        run: |
          dotnet publish src/TbhBot.App/TbhBot.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=0.1.0 `
            -p:InformationalVersion=0.1.0 `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish

          if (-not (Test-Path 'publish/TaskHeroX.exe')) {
            throw 'Publish nao gerou publish/TaskHeroX.exe.'
          }

      - name: Package and generate SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $zip = 'TaskHeroX-v0.1.0-win-x64.zip'
          $zipPath = Join-Path 'dist' $zip
          Compress-Archive -Path 'publish/TaskHeroX.exe' -DestinationPath $zipPath -CompressionLevel Optimal -Force

          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Path "$zipPath.sha256" -Encoding ascii -NoNewline
          Write-Host "Release asset: $zipPath"
          Write-Host "SHA-256: $hash"

      - name: Create official GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.1.0'
          $target = '93dc08ec6ffbd532eaa3c576839821d94dc3004d'
          $zipPath = 'dist/TaskHeroX-v0.1.0-win-x64.zip'
          $shaPath = "$zipPath.sha256"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zipPath $shaPath --clobber
          }
          else {
            gh release create $tag $zipPath $shaPath `
              --target $target `
              --title 'TaskHeroX v0.1.0' `
              --generate-notes
          }
